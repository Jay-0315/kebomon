services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: kebo-app
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kebo-api
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - .:/app
      - api-node-modules:/app/node_modules
      - api-app-node-modules:/app/apps/api/node_modules
    environment:
      API_PORT: ${API_PORT:-4000}
      JWT_SECRET: ${JWT_SECRET:-kebo-dev-secret}
      DATABASE_URL: mysql://${MYSQL_USER:-kebo}:${MYSQL_PASSWORD:-kebo1234}@mysql:3306/${MYSQL_DATABASE:-kebo}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: kebo-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kebo}
      MYSQL_USER: ${MYSQL_USER:-kebo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kebo1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root1234}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:
  api-node-modules:
  api-app-node-modules:
