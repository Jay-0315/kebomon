name: Compress Existing Images (manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "체크하면 실제로 DB에 반영 (안 하면 dry-run — 조회만 하고 아무것도 안 씀)"
        required: true
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  compress-images:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run image compression migration
        env:
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          APPLY_FLAG: ${{ inputs.apply && '--apply' || '' }}
        run: |
          echo "모드: ${{ inputs.apply && 'APPLY (실제 반영)' || 'DRY-RUN (조회만)' }}"
          docker run --rm \
            --network host \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/apps/api:/app" \
            -w /app \
            -e DATABASE_URL="mysql://${MYSQL_USER:-kebo}:${MYSQL_PASSWORD}@127.0.0.1:3306/${MYSQL_DATABASE:-kebo}" \
            -e HOME=/tmp \
            node:20-alpine \
            sh -c "npm install --no-audit --no-fund && npx prisma generate && npx tsx scripts/compress-existing-images.ts $APPLY_FLAG"
