name: CI

on:
  pull_request:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # prisma generate만 하면 되고 실제 DB 연결은 안 함 — schema.prisma가 env("DATABASE_URL")을
      # 참조해서 값이 아예 없으면 경고가 나므로 더미 값만 채워준다
      - run: npm run prisma:generate
        env:
          DATABASE_URL: "mysql://user:pass@localhost:3306/kebo"
      - name: Typecheck
        run: npx tsc --noEmit -p apps/api
      - name: Test
        run: npm test --workspace apps/api
      - name: Build
        run: npm run build:api

  user-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p apps/user-web
      - name: Build
        run: npm run build:user

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p apps/admin-web
      - name: Build
        run: npm run build:admin
