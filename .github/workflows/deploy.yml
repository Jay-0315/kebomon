name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & deploy (docker compose)
        env:
          # Vite 빌드 타임 변수 (번들에 박힘)
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # 런타임 시크릿
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_IDS: ${{ secrets.GOOGLE_CLIENT_IDS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
        run: |
          # 관리자 페이지 Basic Auth 자격증명 파일 생성 (git에는 올리지 않고 배포 때마다 시크릿에서 생성)
          printf '%s:%s\n' \
            "${{ secrets.ADMIN_BASIC_AUTH_USER }}" \
            "$(openssl passwd -apr1 '${{ secrets.ADMIN_BASIC_AUTH_PASSWORD }}')" \
            > deploy/admin.htpasswd

          docker compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
          docker rm -f kebo-mysql kebo-api kebo-web kebo-admin 2>/dev/null || true

          # mysql부터 띄우고 healthy될 때까지 대기 (schema.sql은 볼륨이 새로 생성될 때만 실행되므로,
          # 이미 떠 있던 DB에는 아래로 누락된 컬럼을 보정. MySQL(오라클)은 MariaDB와 달리
          # ADD COLUMN에 IF NOT EXISTS를 못 쓰므로 information_schema로 존재 여부를 먼저 확인하고
          # 동적 SQL(PREPARE/EXECUTE)로 없을 때만 추가 — 매번 실행해도 안전
          docker compose -f docker-compose.prod.yml up -d --build --wait mysql

          docker run --rm --network host \
            -e MYSQL_PWD="${MYSQL_PASSWORD}" \
            mysql:8.4 \
            mysql -h127.0.0.1 -P3306 -u"${MYSQL_USER:-kebo}" "${MYSQL_DATABASE:-kebo}" -e "
              SET @col_exists = (
                SELECT COUNT(*) FROM information_schema.columns
                WHERE table_schema = DATABASE() AND table_name = 'users' AND column_name = 'status'
              );
              SET @sql = IF(@col_exists = 0,
                'ALTER TABLE users ADD COLUMN status VARCHAR(12) NOT NULL DEFAULT ''ACTIVE'' AFTER role',
                'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

              SET @col_exists = (
                SELECT COUNT(*) FROM information_schema.columns
                WHERE table_schema = DATABASE() AND table_name = 'users' AND column_name = 'suspended_reason'
              );
              SET @sql = IF(@col_exists = 0,
                'ALTER TABLE users ADD COLUMN suspended_reason VARCHAR(255) NULL AFTER status',
                'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;

              SET @col_exists = (
                SELECT COUNT(*) FROM information_schema.columns
                WHERE table_schema = DATABASE() AND table_name = 'users' AND column_name = 'suspended_until'
              );
              SET @sql = IF(@col_exists = 0,
                'ALTER TABLE users ADD COLUMN suspended_until DATETIME NULL AFTER suspended_reason',
                'SELECT 1');
              PREPARE stmt FROM @sql; EXECUTE stmt; DEALLOCATE PREPARE stmt;
            "

          # api는 mysql이 healthy해야 뜨므로(depends_on), 위 스키마 보정이 끝난 뒤에만 기동됨
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          sleep 8
          curl -fsS http://localhost:8080/api/health || (docker compose -f docker-compose.prod.yml logs --tail=50 api; exit 1)
          # /admin/은 web이 admin 컨테이너로 프록시 + Basic Auth라 401이 정상 응답 (전체 체인이 붙어있다는 뜻)
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/admin/)
          [ "$code" = "401" ] || (docker compose -f docker-compose.prod.yml logs --tail=50 web admin; exit 1)
